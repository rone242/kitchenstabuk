# Copy this file to /etc/nginx/sites-available/kitchenstabuk, replace the
# example domains, then enable it with a symlink in /etc/nginx/sites-enabled/.
#
# The Docker services are bound to 127.0.0.1 only. These defaults match:
#   API_PORT=4400, WEB_PORT=3300, ADMIN_PORT=3301

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Set NEXT_PUBLIC_API_URL=https://example.com/api in the deployment .env.
    location /api/ {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Optional separate admin hostname. Set ADMIN_URL=https://admin.example.com,
# add it to CORS_ORIGINS, and issue a TLS certificate for it in production.
server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com;

    location / {
        proxy_pass http://127.0.0.1:3301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
