name: kitchenstabuk

services:
  postgres:
    image: postgres:16-alpine
    container_name: kitchenstabuk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kitchenstabuk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-kitchenstabuk}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kitchenstabuk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-kitchenstabuk} -d $${POSTGRES_DB:-kitchenstabuk}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kitchenstabuk-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - kitchenstabuk_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kitchenstabuk_postgres_data:
  kitchenstabuk_redis_data:
